exclude: '^docs/|/migrations/|devcontainer.json'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ['--tab-width', '2', '--single-quote']
        exclude: '{{cookiecutter.project_slug}}/templates/'

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.33.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.31.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/djlint/djLint
    rev: v1.54.0
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  # Import Linting: Check if all apps are registered in .importlinter
  - repo: local
    hooks:
      - id: check-import-linter-coverage
        name: check-import-linter-coverage
        entry: uv run python bin/importlinter_check_coverage.py
        language: system
        pass_filenames: false
        stages: [commit, push]

  # Import Linting: Run import-linter
  - repo: https://github.com/seddonym/import-linter
    rev: 1.9.0
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run import-linter --config .importlinter
        language: system
        pass_filenames: false
        stages: [commit, push]

  # Auto-update .importlinter when new apps are added
  - repo: local
    hooks:
      - id: auto-update-importlinter
        name: auto-update-importlinter
        entry: uv run python bin/importlinter_add_apps.py
        language: system
        pass_filenames: false
        files: ^(config/settings/base\.py|.*/apps\.py)$

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
